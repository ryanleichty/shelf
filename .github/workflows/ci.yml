name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: Smoke test production SSR
        run: |
          PORT=3000 node .output/server/index.mjs > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat server.log' EXIT
          for _ in {1..20}; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)"
            [ "$status" = 200 ] && break
            sleep 1
          done
          [ "$status" = 200 ]
          ! rg -q 'createSsrRpc' server.log
